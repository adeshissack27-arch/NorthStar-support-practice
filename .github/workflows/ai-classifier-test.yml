name: Test Northstar AI Classifier

on:
  workflow_dispatch:

permissions:
  models: read

jobs:
  classify-message:
    runs-on: ubuntu-latest

    steps:
      - name: Test AI classification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            https://models.github.ai/inference/chat/completions \
            -d '{
              "model": "openai/gpt-4.1-mini",
              "messages": [
                {
                  "role": "system",
                  "content": "You are a Northstar Retail support intent classifier. Return ONLY one label: ORDER_STATUS, RETURNS_REFUNDS, or UNSUPPORTED."
                },
                {
                  "role": "user",
                  "content": "Where is ORD1001?"
                }
              ]
            }'
